steps:
  deploy:
    image: docker:27
    pull: true

    # 🔥 호스트 Docker 데몬 붙이기
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    when:
      event:
        - push
      branch:
        - main

    commands:
      - apk add --no-cache bash

      - echo -e "\033[1;36m[DEBUG] Current directory\033[0m"
      - pwd
      - ls -al

      - echo -e "\033[1;34m[STEP]--------------------------------------------\033[0m"
      - echo -e "\033[1;34m[STEP] 배포 시작\033[0m"

      # 1. 기존 컨테이너 정리
      - echo -e "\033[1;34m[STEP] 기존 컨테이너 중지 + 삭제\033[0m"
      - docker stop fin-agent-app || true
      - docker rm fin-agent-app || true
      - echo -e "\033[0;32m[INFO] 기존 컨테이너 정리 완료\033[0m"

      # 2. 이미지 빌드 (지금 디렉토리: /woodpecker/src/…/financial-strategy-agent)
      - echo -e "\033[1;34m[STEP] Docker 이미지 빌드 시작\033[0m"
      - docker build -t fin-agent-app .

      # 3. 새 컨테이너 실행
      - echo -e "\033[1;34m[STEP] 새 컨테이너 실행\033[0m"
      - docker run -d --name fin-agent-app --network fin-net -p 8000:8000 --env-file /home/opc/financial-strategy-agent/.env fin-agent-app

      - echo -e "\033[0;32m[SUCCESS] 배포 완료!\033[0m"
      - docker ps | grep fin-agent-app || true
